name: CI

on:
  push:
    branches: ['**']
    tags: ['**']
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  LISP: sbcl-bin/2.6.8
  CL_SOURCE_REGISTRY: '${{ github.workspace }}/:${{ github.workspace }}/.ci-deps//:'

defaults:
  run:
    shell: bash

jobs:
  fixtures:
    name: Linux / SBCL fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-cpu
      - name: Test client in a fresh Lisp process
        shell: lispsh -eo pipefail {0}
        env:
          CL_INFERENCE_CI_SUITE: client
        run: ros -Q run --load tests/ci.lisp --quit 2>&1 | tee ci-logs/client.log
      - name: Test CPU fixtures and examples
        shell: lispsh -eo pipefail {0}
        env:
          CL_INFERENCE_CI_SUITE: fixtures
        run: ros -Q run --load tests/ci.lisp --quit 2>&1 | tee ci-logs/fixtures.log
      - name: Test reference preparation offline
        run: |
          python3 -m unittest discover -s tests/acceptance -p 'test_*.py' 2>&1 | tee ci-logs/preparation.log
          python3 -m unittest discover -s tests/mlx-gguf -p 'test_*.py' 2>&1 | tee ci-logs/python.log
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-failure
          path: ci-logs/
  acceptance:
    name: Qwen3 F16 CPU acceptance
    needs: fixtures
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-cpu
      - name: Prepare pinned model and oracle
        run: python3 tests/acceptance/prepare-qwen.py 2>&1 | tee ci-logs/preparation.log
      - name: Require all selected acceptance checks
        shell: lispsh -eo pipefail {0}
        env:
          CL_INFERENCE_CI_SUITE: acceptance
        run: ros -Q run --load tests/ci.lisp --quit 2>&1 | tee ci-logs/acceptance.log
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-failure
          path: |
            ci-logs/
            reference/qwen-build/*.log
            reference/oracle/qwen-f16*/**
