name: Set up CPU inference
description: Install SBCL and pinned CPU dependencies without model downloads
runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        repository: communal-software/cl-tensor
        ref: a7f765911268adfce9668ee8b4356f1ab238b01f
        path: .ci-deps/cl-tensor
    - uses: actions/checkout@v4
      with:
        repository: communal-software/trivial-simd
        ref: 19d734f8806e07d5ce5b806e90b44621f4347146
        path: .ci-deps/trivial-simd
    - name: Build native kernels
      shell: bash
      run: |
        mkdir -p ci-logs
        cmake -S .ci-deps/trivial-simd -B .ci-deps/trivial-simd/build -DCMAKE_BUILD_TYPE=Release 2>&1 | tee ci-logs/native-configure.log
        cmake --build .ci-deps/trivial-simd/build --parallel 2 2>&1 | tee ci-logs/native-build.log
    - uses: 40ants/setup-lisp@v4
      with:
        cache: false
        qlot-no-deps: true
        dynamic-space-size: 4GB
